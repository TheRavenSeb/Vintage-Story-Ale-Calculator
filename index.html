<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ale Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="ingredient-inputs">
            <h3>Ingredient calculator</h3>
            <div class="inputs">
                <div id="berries-group">
                    <label for="berries-input">Berries (pieces)</label>
                    <input type="number" id="berries-input" min="0" step="1" placeholder="e.g. 50" />
                </div>

                <div id="flour-group">
                    <label for="flour-input">Flour / Grain</label>
                    <input type="number" id="flour-input" min="0" step="0.1" placeholder="e.g. 50" />
                </div>

                <button id="calc-ingredients">Calculate from ingredients</button>
            </div>
            <div id="ingredient-result" aria-live="polite"></div>
        </section>
        <div class="ale-select-container">
            <label for="ale-select" id="ale-select-label">Choose an alcohol</label>
            <select id="ale-select">
                <!-- Options will be populated by app.js -->
            </select>
        </div>

        <table id="ale-table" border="1">
            <tbody id="ale-tbody">
                <!-- Ale table rows will be generated by app.js -->
            </tbody>
        </table>

        <table id="barrel-table" border="1">
            <tbody id="barrel-tbody">
                <!-- Barrel table rows will be generated by app.js -->
            </tbody>
        </table>
    </main>

    <span class="github">Source code available on
        <a href="https://github.com/TheRavenSeb/Vintage-Story-Ale-Calculator" style="font-weight: 400; text-decoration: underline; color: inherit; text-decoration-color: inherit;">
            Github
        </a>
    </span>

    <!-- scripts at the end so DOM elements are available to app.js -->
    <script src="alcohol.js"></script>
    <script src="app.js"></script>
</body>
</html>
